[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microscope"
version = "0.1.0"
description = "Microscope for molecules: structure and spectroscopy viewer with CYLview-style publication-quality rendering"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Bin Wang" }]
keywords = ["chemistry", "molecular-visualization", "spectroscopy", "gaussian", "orca", "qchem"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pandas",
  "PySide6",
  "PyOpenGL",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
scope = "microscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["microscope"]
