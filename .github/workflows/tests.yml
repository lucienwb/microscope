name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  # no display anywhere in CI; Qt must not try to reach one
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The macOS and Windows Qt wheels ship everything they need, but on a bare
      # Linux runner PySide6 cannot even be imported until the Qt runtime
      # libraries are installed. This list is what libQt6Gui/Core/DBus.so.6
      # actually record as DT_NEEDED, minus what the base image already has
      # (glibc, libstdc++, glib, zlib, zstd).
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxkbcommon0 \
            libfontconfig1 libfreetype6 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check that Qt imports
        run: python -c "import PySide6.QtGui, PySide6.QtWidgets; print('Qt OK')"
      - name: Run tests (headless — parsers, geometry, editing, spectra, CLI)
        run: python -m pytest tests/ -v
